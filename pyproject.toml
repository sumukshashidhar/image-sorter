[project]
name = "image-sorter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless>=4.8.0",
    "loguru>=0.7",
    "rich>=13.0",
]

[project.scripts]
image-sorter = "image_sorter.sorter:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 88
extend-select = ["E", "F", "I", "B", "SIM", "NPY"]
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
